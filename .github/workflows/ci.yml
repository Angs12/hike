name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Kept first so a lift or semantics failure cannot hide unit results.
      - name: Unit tests
        run: nix build -L --print-out-paths .#checks.x86_64-linux.unit

      - name: Build BAP, Hike and the corpus
        run: |
          BAP=$(nix build --print-out-paths .#bap)
          HIKE=$(nix build --print-out-paths .#hike)
          CORPUS=$(nix build --print-out-paths .#corpus)
          echo "bap:    $BAP"
          echo "hike:   $HIKE/bin/hike"
          echo "corpus: $CORPUS"

      - name: Lift gate
        run: nix run .#gate -- lift

      - name: Semantics gate
        run: nix run .#gate -- semantics
